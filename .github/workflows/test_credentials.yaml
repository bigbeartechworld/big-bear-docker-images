name: Credential regression tests

on:
  pull_request:
    paths:
      - 'Apps/big-bear-casaos-user-management/**'
      - 'Apps/minio/**'
      - 'Apps/odysseus/**'
      - 'Apps/btop/**'
      - 'Apps/fastfetch/**'
      - 'Apps/ncdu/**'
      - 'tests/**'
      - '.github/workflows/test_credentials.yaml'
  push:
    branches:
      - main
    paths:
      - 'Apps/big-bear-casaos-user-management/**'
      - 'Apps/minio/**'
      - 'Apps/odysseus/**'
      - 'Apps/btop/**'
      - 'Apps/fastfetch/**'
      - 'Apps/ncdu/**'
      - 'tests/**'
      - '.github/workflows/test_credentials.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    name: Credential regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Prepare isolated test toolchain
        run: docker build --tag credential-regression-toolchain tests

      - name: Run isolated regression suites
        run: |
          docker run --rm \
            --network none \
            --ipc none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 1000:1000 \
            --pids-limit 64 \
            --cpus 1 \
            --memory 256m \
            --memory-swap 256m \
            --ulimit cpu=120:120 \
            --ulimit nproc=64:64 \
            --ulimit fsize=1048576:1048576 \
            --ulimit nofile=128:128 \
            --tmpfs /scratch:rw,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=0700 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/Apps,target=/source/Apps,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests,target=/source/tests,readonly" \
            --entrypoint /usr/bin/timeout \
            credential-regression-toolchain \
            --kill-after=5s 180s /usr/bin/env -i \
            PATH=/usr/local/bin:/usr/bin:/bin \
            HOME=/scratch TMPDIR=/scratch XDG_CACHE_HOME=/scratch/.cache \
            PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 \
            /bin/sh -ec 'python3 -m unittest discover -s tests -v; python3 -m unittest discover -s Apps/big-bear-casaos-user-management/tests -v'
